async function importData(input){try{const file=input.files[0];if(!file)return;if(file.size>100*1024*1024)throw Error('size');const candidate=migrate(JSON.parse(await file.text()));if(!confirm(t('confirmImport')))return;state=candidate;currentList=null;personFilter='all';priorityFilter='all';rollover();await persist();closeModal();render();toast(t('imported'))}catch{toast(t('invalidBackup'))}finally{input.value=''}}
function nudgeTasks(){const time=new Date().toTimeString().slice(0,5);return state.tasks.filter(a=>a.progress<100&&a.date===today()&&a.time&&a.time<=time&&(!currentList||a.list===currentList))}
function renderNudges(){const el=$('nudges');if(!el)return;const due=nudgeTasks(),key=due.map(a=>a.id).join(),relevantRolled=rolled>0;const msg=relevantRolled?(state.lang==='zh'?`${rolled} 件未完成事项已接到今天，进度和图片都在。`:`${rolled} unfinished ${rolled===1?'task is':'tasks are'} here for today, with progress and pictures.`):due.length&&key!==dismissedNudges?(state.lang==='zh'?`${due.length} 件事到了提醒时间，有空时看一眼就好。`:`${due.length} ${due.length===1?'thing has':'things have'} a reminder. Whenever you have a moment.`):'';el.hidden=!msg;el.innerHTML=msg?`${icon('bell')}<span>${escapeHTML(msg)}</span><button onclick="dismissNudges()">×</button>`:''}
function dismissNudges(){rolled=0;dismissedNudges=nudgeTasks().map(a=>a.id).join();renderNudges()}
async function enableNotifications(){try{if(!('Notification'in window))throw Error();const result=await Notification.requestPermission();state.notify=result==='granted';persist();toast(t(state.notify?'notifyYes':'notifyNo'))}catch{toast(t('notifyNo'))}}
function tick(){if(!state)return;const day=today();if(day!==lastDay){if(selectedDay===lastDay)selectedDay=day;lastDay=day;rollover();persist();render()}else if(rollover()){persist();render()}renderNudges();if(state.notify&&'Notification'in window&&Notification.permission==='granted'){const hh=new Date().toTimeString().slice(0,5);let changed=false;for(const a of state.tasks){if(a.progress<100&&a.date===day&&a.time&&a.time<=hh&&a.notified!==day){try{new Notification(t('nudgeTitleShort'),{body:tx(a,'title')+' · '+t('permissionText'),tag:a.id});a.notified=day;changed=true}catch{}}}if(changed)persist()}}
function toast(msg){clearTimeout(toastTimer);$('toast').textContent=msg;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
document.querySelectorAll('.dialog-backdrop').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)closeModal()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const dialog=[...document.querySelectorAll('.dialog-backdrop')].find(el=>!el.hidden);if(!dialog)return;const focus=[...dialog.querySelectorAll('button,input,textarea,select')].filter(el=>!el.disabled&&!el.hidden&&el.offsetParent!==null),first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('beforeunload',e=>{if(saveFailed||imageBusy){e.preventDefault();e.returnValue=''}});boot();
</script></body></html>
